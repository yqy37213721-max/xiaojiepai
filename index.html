<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>小姐牌 · 聚会喝酒游戏</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="bg-gradient">
    <div class="page">
      <!-- 标题 -->
      <div class="page-title">
        <h1>小姐牌</h1>
        <div class="subtitle">多人在线 · 聚会喝酒游戏</div>
      </div>

      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 0;">
        <!-- 创建房间 -->
        <button class="btn btn-primary" id="createRoomBtn" onclick="createRoom()">
          创建房间
        </button>

        <!-- 分割线 -->
        <div class="divider">或</div>

        <!-- 加入房间 -->
        <div class="card" style="padding:20px;">
          <div class="card-title">加入房间</div>
          <div class="input-group">
            <input
              class="input input-lg"
              id="roomCodeInput"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              placeholder="0000"
              autocomplete="off"
              oninput="this.value=this.value.replace(/\D/g,'')"
              onkeydown="if(event.key==='Enter') joinRoom()"
            >
          </div>
          <button class="btn btn-secondary" id="joinRoomBtn" onclick="joinRoom()" style="margin-top:16px;">
            加入房间
          </button>
        </div>
      </div>

      <!-- 底部 -->
      <div style="text-align:center;padding:16px 0 8px;font-size:12px;color:rgba(255,255,255,0.15);">
        无需注册 · 扫码即玩 · 多人实时
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
