<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>小姐牌 · 聚会喝酒游戏</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* 观战模式入口 */
    .spectator-banner {
      display: none;
      text-align: center;
      padding: 16px 20px;
      margin: 0 0 8px;
    }
    .spectator-banner .hint {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 10px;
    }
    .spectator-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .spectator-btns .btn {
      flex: 1;
      max-width: 200px;
    }
    .btn-ghost {
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.5);
      border: 1px dashed rgba(255,255,255,0.12);
    }
    .btn-ghost:hover {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
    }
    .btn-live {
      background: rgba(74,222,128,0.1);
      color: #4ade80;
      border: 1px solid rgba(74,222,128,0.2);
    }
    .btn-live:hover {
      background: rgba(74,222,128,0.15);
    }
  </style>
</head>
<body>
  <div class="bg-gradient">
    <div class="page">
      <!-- 标题 -->
      <div class="page-title">
        <h1>小姐牌</h1>
        <div class="subtitle">多人在线 · 聚会喝酒游戏</div>
      </div>

      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 0;">
        <!-- 创建房间 -->
        <button class="btn btn-primary" id="createRoomBtn" onclick="createRoom()">
          创建房间
        </button>

        <!-- 分割线 -->
        <div class="divider">或</div>

        <!-- 加入房间 -->
        <div class="card" style="padding:20px;">
          <div class="card-title">加入房间</div>
          <div class="input-group">
            <input
              class="input input-lg"
              id="roomCodeInput"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              placeholder="0000"
              autocomplete="off"
              oninput="this.value=this.value.replace(/\D/g,'')"
              onkeydown="if(event.key==='Enter') joinRoom()"
            >
          </div>
          <button class="btn btn-secondary" id="joinRoomBtn" onclick="joinRoom()" style="margin-top:16px;">
            加入房间
          </button>
        </div>
      </div>

      <!-- 观战入口 -->
      <div class="spectator-banner" id="spectatorBanner">
        <div class="hint">这个房间正在进行中，你可以在一旁围观</div>
        <div class="spectator-btns">
          <button class="btn btn-live" onclick="liveWatch()">🔴 加入观战</button>
          <button class="btn btn-ghost" onclick="joinAsPlayer()">加入对战</button>
        </div>
      </div>

      <!-- 最近玩过的房间 -->
      <div id="recentRooms" style="display:none;margin-top:8px;">
        <div style="text-align:center;font-size:12px;color:rgba(255,255,255,0.2);margin-bottom:8px;">最近玩过的房间</div>
        <div id="recentList" style="display:flex;flex-direction:column;gap:6px;"></div>
      </div>

      <!-- 底部 -->
      <div style="text-align:center;padding:16px 0 8px;font-size:12px;color:rgba(255,255,255,0.15);">
        无需注册 · 扫码即玩 · 多人实时
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  
  <!-- 备用 CDN -->
  <script>window.__supabaseLoaded = false;</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" onload="window.__supabaseLoaded=true" onerror="console.warn('supabase CDN failed')"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/index.js"></script>
  <script src="js/room_history.js"></script>
</body>
</html>
