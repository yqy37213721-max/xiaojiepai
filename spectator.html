<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>观战 · 小姐牌</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* ---- 观战模式专属样式 ---- */
    .spectator-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.2);
      border-radius: 20px;
      font-size: 12px;
      color: #4ade80;
      font-weight: 600;
    }
    .spectator-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: live-pulse 1.5s infinite;
    }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 观战玩家列表 */
    .spectator-player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 0;
    }
    .spectator-player-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .spectator-player-tag .seat {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }
    .spectator-player-tag .online-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }
    .spectator-player-tag .offline-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }

    /* ---- 卡牌翻转（复用 game.html） ---- */
    .card-scene {
      perspective: 1000px;
      width: 140px;
      height: 196px;
      margin: 0 auto;
    }
    .card-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-wrapper.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card-back {
      background: linear-gradient(135deg, #6C3CE1, #3B82F6);
      border: 2px solid rgba(255,255,255,0.15);
    }
    .card-back::after {
      content: '🃏';
      font-size: 44px;
      opacity: 0.6;
    }
    .card-face.card-front {
      background: #fff;
      transform: rotateY(180deg);
      padding: 12px;
    }
    .card-face.card-front .cv {
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }
    .card-face.card-front .cs {
      font-size: 24px;
      line-height: 1;
      margin-top: 4px;
    }
    .card-face.card-front .cjoker {
      font-size: 36px;
      margin-bottom: 4px;
    }

    /* ---- 规则展示 ---- */
    .rule-display {
      text-align: center;
      padding: 12px 0 8px;
      min-height: 72px;
    }
    .rule-display .r-emoji {
      font-size: 28px;
      margin-bottom: 4px;
      display: none;
    }
    .rule-display .r-emoji.show { display: block; }
    .rule-display .r-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      display: none;
    }
    .rule-display .r-name.show { display: block; }
    .rule-display .r-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      line-height: 1.5;
      display: none;
    }
    .rule-display .r-desc.show { display: block; }

    /* ---- 游戏信息条 ---- */
    .info-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
    }
    .info-bar .round {
      font-weight: 600;
      color: rgba(255,255,255,0.6);
    }

    /* ---- 当前轮到 ---- */
    .turn-indicator {
      text-align: center;
      padding: 10px 0;
      font-size: 15px;
      color: rgba(255,255,255,0.5);
    }
    .turn-indicator strong {
      color: #a78bfa;
      font-weight: 700;
    }

    /* ---- 特殊状态条 ---- */
    .states-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 0;
      min-height: 20px;
    }
    .state-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }
    .state-tag .emoji { font-size: 14px; }

    /* ---- 历史记录 ---- */
    .history-section { margin-top: 4px; }
    .history-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .history-toggle:hover { color: rgba(255,255,255,0.5); }
    .history-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .history-list.open { max-height: 400px; }
    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .history-item:last-child { border-bottom: none; }
    .history-item .h-seq { color: rgba(255,255,255,0.2); width: 20px; }
    .history-item .h-card { font-weight: 600; }
    .history-item .h-rule { color: #a78bfa; }
    .history-item .h-by { color: rgba(255,255,255,0.3); }

    /* ---- 底部提示 ---- */
    .spectator-footer {
      text-align: center;
      padding: 12px 0 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="bg-gradient">
    <div class="page" id="spectatorPage" style="display:none;">
      <!-- 顶栏 -->
      <div class="info-bar">
        <span onclick="goBack()" style="cursor:pointer;">← <span id="gRoomCode">----</span></span>
        <span style="display:flex;align-items:center;gap:12px;">
          <span class="spectator-badge"><span class="dot"></span> 观战中</span>
          <span class="round"><span id="roundNum">0</span>/<span id="totalCards">54</span> 轮</span>
        </span>
      </div>

      <!-- 玩家列表 -->
      <div class="card" style="padding:12px 16px;margin-bottom:0;">
        <div class="spectator-player-list" id="playerList">
          <div class="empty-state">加载中...</div>
        </div>
      </div>

      <!-- 卡牌区 -->
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0;">
        <div class="card-scene" id="cardScene">
          <div class="card-wrapper" id="cardWrapper">
            <!-- 背面 -->
            <div class="card-face card-back"></div>
            <!-- 正面 -->
            <div class="card-face card-front" id="cardFront">
              <div class="cjoker" id="cJoker"></div>
              <div class="cv" id="cValue"></div>
              <div class="cs" id="cSuit"></div>
            </div>
          </div>
        </div>

        <!-- 规则 -->
        <div class="rule-display">
          <div class="r-emoji" id="rEmoji"></div>
          <div class="r-name" id="rName"></div>
          <div class="r-desc" id="rDesc"></div>
        </div>
      </div>

      <!-- 当前轮到 -->
      <div class="turn-indicator" id="turnIndicator">
        当前轮到: <strong id="turnPlayer">--</strong>
      </div>

      <!-- 特殊状态 & 历史 -->
      <div class="card" style="padding:12px 16px;margin-bottom:0;">
        <div class="states-bar" id="statesBar"></div>
        <div class="history-section">
          <button class="history-toggle" onclick="toggleHistory()">
            ▸ <span id="histLabel">抽牌记录</span>
          </button>
          <div class="history-list" id="historyList"></div>
        </div>
      </div>

      <!-- 底部提示 -->
      <div class="spectator-footer">
        观战模式 · 无法参与游戏
      </div>
    </div>

    <!-- 加载 -->
    <div class="page" id="loadingPage">
      <div class="loading-page">
        <div class="loading-spinner"></div>
        <span>连接观战中...</span>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  
  <!-- 备用 CDN -->
  <script>window.__supabaseLoaded = false;</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" onload="window.__supabaseLoaded=true" onerror="console.warn('supabase CDN failed')"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/spectator.js"></script>
</body>
</html>
